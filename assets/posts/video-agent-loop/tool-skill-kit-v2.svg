<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tool 与 Skill 在视频 Agent 中的不同职责</title>
  <desc id="desc">Skill 是按需加载的方法和领域说明，帮助模型决定如何工作；Tool 是可执行接口，分为感知、操作、协作和异步四组。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#17132a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
    <marker id="violet" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker>
    <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:38px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.t{font-size:21px;font-weight:700;fill:#f8fafc}.p{font-size:16px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.tool{font-size:15px;font-weight:700;fill:#e2e8f0}.box{filter:url(#shadow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" class="h">Skill 教它怎么做，Tool 让它真的做到</text>
  <text x="800" y="98" text-anchor="middle" class="sub">一个是按需加载的方法，一个是可以被调用的手和感知系统</text>

  <g class="box"><rect x="90" y="180" width="400" height="500" rx="30" fill="#282044" stroke="#a78bfa" stroke-width="2"/></g>
  <text x="290" y="230" text-anchor="middle" class="t">Skill · 方法</text>
  <text x="290" y="270" text-anchor="middle" class="p">什么时候读什么、按什么顺序做</text>
  <rect x="140" y="315" width="300" height="72" rx="16" fill="#352b58"/><text x="290" y="345" text-anchor="middle" class="tool">timeline-editing</text><text x="290" y="370" text-anchor="middle" class="m">轨道、Clip、字幕与时间语义</text>
  <rect x="140" y="415" width="300" height="72" rx="16" fill="#352b58"/><text x="290" y="445" text-anchor="middle" class="tool">media-gen</text><text x="290" y="470" text-anchor="middle" class="m">选模型、组织输入、处理生成结果</text>
  <rect x="140" y="515" width="300" height="72" rx="16" fill="#352b58"/><text x="290" y="545" text-anchor="middle" class="tool">graphics</text><text x="290" y="570" text-anchor="middle" class="m">SVG、MG 与动态视觉规范</text>
  <text x="290" y="630" text-anchor="middle" class="m">Skill 不改项目，也不替代 Tool</text>

  <g class="box"><circle cx="800" cy="430" r="150" fill="#103249" stroke="#38bdf8" stroke-width="3"/></g>
  <text x="800" y="410" text-anchor="middle" class="t">模型</text>
  <text x="800" y="447" text-anchor="middle" class="p">理解目标，选择能力</text>
  <text x="800" y="478" text-anchor="middle" class="m">Skill 进入上下文 · Tool 形成调用</text>
  <path d="M490 430H640" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#violet)"/>

  <g class="box"><rect x="1070" y="150" width="440" height="600" rx="30" fill="#102432" stroke="#38bdf8" stroke-width="2"/></g>
  <text x="1290" y="202" text-anchor="middle" class="t">Tool · 可执行能力</text>
  <rect x="1115" y="245" width="350" height="92" rx="18" fill="#103249"/>
  <text x="1145" y="277" class="tool">感知</text><text x="1145" y="310" class="p">glob · grep · read · head · query</text>
  <rect x="1115" y="365" width="350" height="92" rx="18" fill="#15342f"/>
  <text x="1145" y="397" class="tool">操作</text><text x="1145" y="430" class="p">write · edit · client_call</text>
  <rect x="1115" y="485" width="350" height="92" rx="18" fill="#34283c"/>
  <text x="1145" y="517" class="tool">协作</text><text x="1145" y="550" class="p">ask_user</text>
  <rect x="1115" y="605" width="350" height="92" rx="18" fill="#282044"/>
  <text x="1145" y="637" class="tool">异步</text><text x="1145" y="670" class="p">run_task · clock</text>
  <path d="M950 430H1060" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#cyan)"/>

  <rect x="235" y="790" width="1130" height="65" rx="20" fill="#171e2e" stroke="#475569"/>
  <text x="800" y="830" text-anchor="middle" class="p">Tool Schema 约束“能传什么”；Skill 说明“什么时候用、怎样组合、做到什么标准”</text>
</svg>
