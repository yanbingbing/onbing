<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">同一 Tool Call 协议连接四种执行边界</title>
  <desc id="desc">模型形成的 Tool Call 先成为已提交消息，再依据执行策略交给人、Server Runner、Client Runner 或由 Server Runner 提交后台 Task。所有同步结果以 toolCallId 回到 Inbox；后台 Task 进入 Monitor。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#151326"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
    <marker id="violet" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker>
    <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:40px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.t{font-size:21px;font-weight:700;fill:#f8fafc}.p{font-size:17px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.tag{font-size:15px;font-weight:700}.box{filter:url(#shadow)}</style>
  </defs>
  <rect width="1800" height="1080" fill="url(#bg)"/>
  <text x="900" y="58" text-anchor="middle" class="h">Tool Call 是消息，执行权不是消息</text>
  <text x="900" y="96" text-anchor="middle" class="sub">所有人都可以看见已提交调用，但只有被选中的执行者可以行动</text>

  <g class="box"><rect x="520" y="145" width="760" height="135" rx="28" fill="#282044" stroke="#a78bfa" stroke-width="2"/></g>
  <text x="900" y="190" text-anchor="middle" class="t">Committed Tool Call</text>
  <text x="900" y="226" text-anchor="middle" class="p">toolName + input + toolCallId</text>
  <text x="900" y="255" text-anchor="middle" class="m">先进入持久消息，再跨越执行边界</text>

  <g class="box">
    <rect x="70" y="390" width="370" height="260" rx="28" fill="#34283c" stroke="#f472b6"/>
    <rect x="500" y="365" width="370" height="310" rx="28" fill="#102e43" stroke="#38bdf8" stroke-width="2"/>
    <rect x="930" y="365" width="370" height="310" rx="28" fill="#15342f" stroke="#34d399" stroke-width="2"/>
    <rect x="1360" y="390" width="370" height="260" rx="28" fill="#282044" stroke="#a78bfa"/>
  </g>
  <text x="255" y="435" text-anchor="middle" class="t">Human</text>
  <text x="255" y="474" text-anchor="middle" class="p">ask_user</text>
  <text x="255" y="512" text-anchor="middle" class="m">问题保存后，当前 Run 结束</text>
  <text x="255" y="541" text-anchor="middle" class="m">用户回答原 Tool Call</text>
  <rect x="150" y="575" width="210" height="42" rx="13" fill="#4a2d42"/><text x="255" y="602" text-anchor="middle" class="tag" fill="#fbcfe8">唯一 Result</text>

  <text x="685" y="412" text-anchor="middle" class="t">Server Runner</text>
  <text x="685" y="451" text-anchor="middle" class="p">query · load_skill · clock</text>
  <text x="685" y="489" text-anchor="middle" class="m">订阅已提交消息，按工具名处理</text>
  <text x="685" y="518" text-anchor="middle" class="m">运行逻辑不进入通用 Loop</text>
  <rect x="580" y="563" width="210" height="48" rx="14" fill="#14384b"/><text x="685" y="593" text-anchor="middle" class="tag" fill="#a5f3fc">Result → Inbox</text>
  <text x="685" y="646" text-anchor="middle" class="m">短结果可在同一 Run 继续</text>

  <text x="1115" y="412" text-anchor="middle" class="t">Client Runner</text>
  <text x="1115" y="451" text-anchor="middle" class="p">read · write · edit · client_call</text>
  <text x="1115" y="489" text-anchor="middle" class="m">只有被选中的 Editor 才能执行</text>
  <text x="1115" y="518" text-anchor="middle" class="m">多窗口也不会重复修改画布</text>
  <rect x="1010" y="563" width="210" height="48" rx="14" fill="#0f443d"/><text x="1115" y="593" text-anchor="middle" class="tag" fill="#a7f3d0">Result → Inbox</text>
  <text x="1115" y="646" text-anchor="middle" class="m">真正改动浏览器里的项目现场</text>

  <text x="1545" y="435" text-anchor="middle" class="t">Task Worker</text>
  <text x="1545" y="474" text-anchor="middle" class="p">图片 · 视频 · 语音 · 转写</text>
  <text x="1545" y="512" text-anchor="middle" class="m">由 Server Runner 先建立 WaitPort</text>
  <text x="1545" y="541" text-anchor="middle" class="m">Task Worker 不认识 Session</text>
  <rect x="1440" y="575" width="210" height="42" rx="13" fill="#352b58"/><text x="1545" y="602" text-anchor="middle" class="tag" fill="#ddd6fe">Task → Monitor</text>

  <path d="M715 280C630 325 255 325 255 380" stroke="#f472b6" stroke-width="3" fill="none" marker-end="url(#violet)"/>
  <path d="M825 280C790 320 685 320 685 355" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#cyan)"/>
  <path d="M975 280C1015 320 1115 320 1115 355" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#green)"/>
  <path d="M1085 280C1180 325 1545 325 1545 380" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#violet)"/>

  <g class="box"><rect x="250" y="790" width="820" height="150" rx="28" fill="#15342f" stroke="#34d399" stroke-width="2"/></g>
  <text x="660" y="835" text-anchor="middle" class="t">统一返回面：Inbox</text>
  <text x="660" y="874" text-anchor="middle" class="p">Tool Result 只用 toolCallId 找回原调用，不关心结果来自人、服务端还是浏览器</text>
  <text x="660" y="908" text-anchor="middle" class="m">当前 Run 正在等待，就直接继续；已经结束，就启动新的 Run</text>
  <path d="M255 650C255 720 430 735 510 780" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <path d="M685 675V780" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#cyan)"/>
  <path d="M1115 675C1115 725 920 740 845 780" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#green)"/>

  <g class="box"><rect x="1190" y="790" width="360" height="150" rx="28" fill="#282044" stroke="#a78bfa"/></g>
  <text x="1370" y="835" text-anchor="middle" class="t">Monitor</text>
  <text x="1370" y="874" text-anchor="middle" class="p">Task 新版本 → 隐藏上下文</text>
  <text x="1370" y="908" text-anchor="middle" class="m">已经完成的调用不会收到第二个 Result</text>
  <path d="M1545 650C1545 720 1460 740 1415 780" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#violet)"/>

  <rect x="270" y="985" width="1260" height="60" rx="19" fill="#171e2e" stroke="#475569"/>
  <text x="900" y="1022" text-anchor="middle" class="p">MessageStream 让调用可见；执行策略、租约与凭证决定谁能执行</text>
</svg>
