<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">外部 Agent 通过统一项目能力控制同一块画布</title>
  <desc id="desc">StarCut 内置 Agent 和 Codex 等外部 Agent 各自保留自己的 Loop。内置 Tool、当前 MCP 和未来 CLI 作为不同适配器，向统一 Project API 收敛。项目操作复用同一语义写入路径，现场操作只交给一个在线 Editor。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#151326"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
    <marker id="violet" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker>
    <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:40px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.t{font-size:21px;font-weight:700;fill:#f8fafc}.p{font-size:17px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.tag{font-size:15px;font-weight:700}.box{filter:url(#shadow)}</style>
  </defs>
  <rect width="1800" height="980" fill="url(#bg)"/>
  <text x="900" y="60" text-anchor="middle" class="h">外部 Agent 不接管画布，它复用 StarCut 的项目能力</text>
  <text x="900" y="100" text-anchor="middle" class="sub">每个 Agent 保留自己的 Loop；入口不同，项目语义和执行边界不能分叉</text>

  <g class="box">
    <rect x="85" y="170" width="480" height="150" rx="28" fill="#102e43" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1235" y="170" width="480" height="150" rx="28" fill="#282044" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="325" y="222" text-anchor="middle" class="t">StarCut 内置 Agent</text>
  <text x="325" y="260" text-anchor="middle" class="p">自己的 Video Agent Loop</text>
  <text x="325" y="291" text-anchor="middle" class="m">用内置 Tool 读取和修改项目</text>
  <text x="1475" y="222" text-anchor="middle" class="t">Codex / Claude Code</text>
  <text x="1475" y="260" text-anchor="middle" class="p">保留各自的 Session 与 Loop</text>
  <text x="1475" y="291" text-anchor="middle" class="m">不模拟鼠标，不依赖屏幕坐标</text>

  <g class="box">
    <rect x="125" y="390" width="400" height="110" rx="24" fill="#103249" stroke="#38bdf8"/>
    <rect x="1075" y="390" width="300" height="110" rx="24" fill="#31244f" stroke="#a78bfa"/>
    <rect x="1415" y="390" width="300" height="110" rx="24" fill="#24213c" stroke="#64748b"/>
  </g>
  <text x="325" y="435" text-anchor="middle" class="t">内置 Tool</text>
  <text x="325" y="469" text-anchor="middle" class="m">StarCut 当前入口</text>
  <text x="1225" y="435" text-anchor="middle" class="t">MCP</text>
  <text x="1225" y="469" text-anchor="middle" class="m">外部 Agent 当前入口</text>
  <text x="1565" y="435" text-anchor="middle" class="t">CLI</text>
  <text x="1565" y="469" text-anchor="middle" class="m">未来脚本与终端入口</text>
  <path d="M325 320V380" stroke="#67e8f9" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M1475 320C1475 350 1225 350 1225 380" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#violet)"/>
  <path d="M1475 320C1475 350 1565 350 1565 380" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="9 8" marker-end="url(#violet)"/>

  <g class="box"><rect x="390" y="585" width="1020" height="150" rx="32" fill="#121d2c" stroke="#6ee7b7" stroke-width="3"/></g>
  <rect x="755" y="605" width="290" height="34" rx="17" fill="#6ee7b7"/>
  <text x="900" y="628" text-anchor="middle" class="tag" fill="#07131f">API 化方向</text>
  <text x="900" y="680" text-anchor="middle" class="h">统一 Project API</text>
  <text x="900" y="716" text-anchor="middle" class="sub">一种能力只定义一次；MCP、CLI 和内置 Tool 只负责翻译</text>
  <path d="M325 500C325 550 650 530 720 575" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#cyan)"/>
  <path d="M1225 500C1225 550 1080 535 1040 575" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#violet)"/>
  <path d="M1565 500C1565 550 1200 535 1110 575" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="9 8" marker-end="url(#violet)"/>

  <g class="box">
    <rect x="170" y="820" width="620" height="120" rx="26" fill="#15342f" stroke="#34d399"/>
    <rect x="1010" y="820" width="620" height="120" rx="26" fill="#282044" stroke="#a78bfa"/>
  </g>
  <text x="480" y="865" text-anchor="middle" class="t">项目操作</text>
  <text x="480" y="900" text-anchor="middle" class="p">read / write / edit → 同一项目 → 同一画布</text>
  <text x="1320" y="865" text-anchor="middle" class="t">现场操作</text>
  <text x="1320" y="900" text-anchor="middle" class="p">播放 / 预览 / 渲染 → 一个在线 Editor</text>
  <text x="1320" y="927" text-anchor="middle" class="m">长连接发现现场，执行权防止多窗口重复行动</text>
  <path d="M700 735C650 775 520 775 480 810" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#green)"/>
  <path d="M1100 735C1150 775 1280 775 1320 810" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#violet)"/>
</svg>
