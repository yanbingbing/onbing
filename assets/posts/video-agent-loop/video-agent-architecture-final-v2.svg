<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Harness 接住循环，StarCut 接住创作现场</title>
  <desc id="desc">用户把视频目标交给 Agent。DeepSeek Harness 需要承接 Session 历史、Inbox、Run 调度和 ToolLoop 等通用运行时；StarCut 保留视频项目工具、媒体 Task 与 Artifact、在线 Editor 和项目语义，最终产出可继续编辑的视频。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#151326"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
    <marker id="violet" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker>
    <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:42px;font-weight:700;fill:#f8fafc}.sub{font-size:21px;fill:#94a3b8}.band{font-size:24px;font-weight:700}.t{font-size:20px;font-weight:700;fill:#f8fafc}.p{font-size:17px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.box{filter:url(#shadow)}</style>
  </defs>
  <rect width="1800" height="980" fill="url(#bg)"/>
  <text x="900" y="60" text-anchor="middle" class="h">Harness 接住循环，StarCut 接住创作现场</text>
  <text x="900" y="102" text-anchor="middle" class="sub">目标不是再包一层，而是让通用运行时与视频业务各自只剩一份</text>

  <g class="box">
    <rect x="55" y="205" width="275" height="250" rx="30" fill="#102e43" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1470" y="175" width="275" height="550" rx="30" fill="#15342f" stroke="#34d399" stroke-width="2"/>
  </g>
  <text x="192" y="258" text-anchor="middle" class="t">用户的创作目标</text>
  <rect x="95" y="305" width="195" height="85" rx="18" fill="#12384a"/>
  <text x="192" y="338" text-anchor="middle" class="p">“做一条 30 秒</text>
  <text x="192" y="369" text-anchor="middle" class="p">竖屏新品视频”</text>
  <text x="192" y="423" text-anchor="middle" class="m">只描述结果，不操心进程</text>

  <rect x="390" y="160" width="1020" height="270" rx="34" fill="#211b35" stroke="#a78bfa" stroke-width="3"/>
  <text x="435" y="207" class="band" fill="#ddd6fe">DeepSeek Harness 需要接住的通用运行时</text>
  <g class="box">
    <rect x="450" y="245" width="260" height="130" rx="22" fill="#30265a"/>
    <rect x="770" y="245" width="260" height="130" rx="22" fill="#30265a"/>
    <rect x="1090" y="245" width="260" height="130" rx="22" fill="#30265a"/>
  </g>
  <text x="580" y="290" text-anchor="middle" class="t">持续的 Session</text>
  <text x="580" y="326" text-anchor="middle" class="p">历史 · 运行协调 · 恢复</text>
  <text x="900" y="290" text-anchor="middle" class="t">Run 与 ToolLoop</text>
  <text x="900" y="326" text-anchor="middle" class="p">模型 · Step · Tool Pipeline</text>
  <text x="1220" y="290" text-anchor="middle" class="t">统一 Inbox</text>
  <text x="1220" y="326" text-anchor="middle" class="p">用户 · 结果 · 任务 · 时间</text>
  <path d="M710 310H760" stroke="#c4b5fd" stroke-width="4" marker-end="url(#violet)"/>
  <path d="M1030 310H1080" stroke="#c4b5fd" stroke-width="4" marker-end="url(#violet)"/>

  <rect x="390" y="485" width="1020" height="280" rx="34" fill="#102432" stroke="#38bdf8" stroke-width="3"/>
  <text x="435" y="532" class="band" fill="#a5f3fc">StarCut 必须保留的视频创作现场</text>
  <g class="box">
    <rect x="450" y="570" width="260" height="140" rx="22" fill="#103249"/>
    <rect x="770" y="570" width="260" height="140" rx="22" fill="#15342f"/>
    <rect x="1090" y="570" width="260" height="140" rx="22" fill="#282044"/>
  </g>
  <text x="580" y="614" text-anchor="middle" class="t">项目语义</text>
  <text x="580" y="650" text-anchor="middle" class="p">read · write · edit</text>
  <text x="580" y="681" text-anchor="middle" class="m">时间线、文档与可编辑素材</text>
  <text x="900" y="614" text-anchor="middle" class="t">Task 与 Artifact</text>
  <text x="900" y="650" text-anchor="middle" class="p">图片 · 视频 · 语音</text>
  <text x="900" y="681" text-anchor="middle" class="m">生成结果是持续存在的业务事实</text>
  <text x="1220" y="614" text-anchor="middle" class="t">在线 Editor</text>
  <text x="1220" y="650" text-anchor="middle" class="p">播放 · 预览 · 渲染</text>
  <text x="1220" y="681" text-anchor="middle" class="m">一个窗口取得现场执行权</text>

  <path d="M330 330H380" stroke="#67e8f9" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M900 430V475" stroke="#67e8f9" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M1410 625H1460" stroke="#6ee7b7" stroke-width="4" marker-end="url(#green)"/>

  <text x="1607" y="225" text-anchor="middle" class="t">可继续编辑的视频</text>
  <rect x="1510" y="270" width="195" height="260" rx="20" fill="#08111d" stroke="#67e8f9"/>
  <rect x="1530" y="290" width="155" height="165" rx="14" fill="#111827"/>
  <circle cx="1607" cy="367" r="36" fill="#1d4ed8" opacity=".8"/>
  <path d="M1595 345L1627 367L1595 389Z" fill="#f8fafc"/>
  <rect x="1530" y="475" width="48" height="12" rx="6" fill="#6ee7b7"/>
  <rect x="1585" y="475" width="70" height="12" rx="6" fill="#a78bfa"/>
  <rect x="1662" y="475" width="23" height="12" rx="6" fill="#38bdf8"/>
  <rect x="1530" y="497" width="82" height="12" rx="6" fill="#38bdf8"/>
  <rect x="1619" y="497" width="66" height="12" rx="6" fill="#6ee7b7"/>
  <text x="1607" y="578" text-anchor="middle" class="p">画布 · 时间线 · 产物</text>
  <text x="1607" y="614" text-anchor="middle" class="m">人可以继续改</text>
  <text x="1607" y="644" text-anchor="middle" class="m">Agent 也可以继续做</text>
  <path d="M1607 725C1607 825 1250 830 1220 385" stroke="#6ee7b7" stroke-width="3" fill="none" stroke-dasharray="10 10" marker-end="url(#green)"/>

  <g class="box"><rect x="235" y="835" width="1330" height="100" rx="28" fill="#171e2e" stroke="#475569"/></g>
  <text x="900" y="877" text-anchor="middle" class="t">DeepSeek Harness 的挑战：接入，而不是复制</text>
  <text x="900" y="913" text-anchor="middle" class="p">消息、Task、项目各有唯一事实来源；接完以后系统应该少一层，而不是多一套状态</text>
</svg>
