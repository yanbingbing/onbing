<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">query 通过 Server Runner 回到同一次 Run</title>
  <desc id="desc">ToolLoop 保存 query 调用。Server Runner 读取已提交消息并查询权威模型目录。结果带着原调用身份进入 Inbox，正在等待的 Run 继续选择模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#151326"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker>
    <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:40px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.step{font-size:15px;font-weight:700;letter-spacing:1px}.t{font-size:21px;font-weight:700;fill:#f8fafc}.p{font-size:17px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.box{filter:url(#shadow)}</style>
  </defs>
  <rect width="1800" height="820" fill="url(#bg)"/>
  <text x="900" y="60" text-anchor="middle" class="h">query：Loop 管调用，应用层做查询</text>
  <text x="900" y="100" text-anchor="middle" class="sub">多走一圈，是为了让通用循环不必认识模型目录</text>

  <g class="box">
    <rect x="65" y="190" width="300" height="310" rx="28" fill="#282044" stroke="#a78bfa" stroke-width="2"/>
    <rect x="410" y="190" width="300" height="310" rx="28" fill="#102e43" stroke="#38bdf8" stroke-width="2"/>
    <rect x="755" y="190" width="300" height="310" rx="28" fill="#102e43" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1100" y="190" width="300" height="310" rx="28" fill="#15342f" stroke="#34d399" stroke-width="2"/>
    <rect x="1445" y="190" width="290" height="310" rx="28" fill="#282044" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <text x="105" y="232" class="step" fill="#c4b5fd">TOOLLOOP</text>
  <text x="215" y="282" text-anchor="middle" class="t">需要一个图片模型</text>
  <rect x="105" y="320" width="220" height="92" rx="18" fill="#30265a"/>
  <text x="215" y="357" text-anchor="middle" class="p">query</text>
  <text x="215" y="386" text-anchor="middle" class="m">用途：商品特写</text>
  <text x="215" y="462" text-anchor="middle" class="m">不认识模型目录实现</text>

  <text x="450" y="232" class="step" fill="#67e8f9">MESSAGE</text>
  <text x="560" y="282" text-anchor="middle" class="t">先保存调用</text>
  <rect x="450" y="320" width="220" height="92" rx="18" fill="#12384a"/>
  <text x="560" y="357" text-anchor="middle" class="p">已提交 Tool Call</text>
  <text x="560" y="386" text-anchor="middle" class="m">输入 + 原调用身份</text>
  <text x="560" y="462" text-anchor="middle" class="m">此时已经可以恢复</text>

  <text x="795" y="232" class="step" fill="#67e8f9">SERVER RUNNER</text>
  <text x="905" y="282" text-anchor="middle" class="t">执行真实查询</text>
  <rect x="795" y="320" width="220" height="92" rx="18" fill="#12384a"/>
  <text x="905" y="357" text-anchor="middle" class="p">读取权威模型目录</text>
  <text x="905" y="386" text-anchor="middle" class="m">筛选能力与输入要求</text>
  <text x="905" y="462" text-anchor="middle" class="m">业务实现停在应用层</text>

  <text x="1140" y="232" class="step" fill="#6ee7b7">INBOX</text>
  <text x="1250" y="282" text-anchor="middle" class="t">结果找回原调用</text>
  <rect x="1140" y="320" width="220" height="92" rx="18" fill="#0f443d"/>
  <text x="1250" y="357" text-anchor="middle" class="p">候选模型列表</text>
  <text x="1250" y="386" text-anchor="middle" class="m">携带原调用身份</text>
  <text x="1250" y="462" text-anchor="middle" class="m">统一返回给 Session</text>

  <text x="1485" y="232" class="step" fill="#c4b5fd">SAME RUN</text>
  <text x="1590" y="282" text-anchor="middle" class="t">拿到事实后继续</text>
  <rect x="1485" y="320" width="210" height="92" rx="18" fill="#30265a"/>
  <text x="1590" y="357" text-anchor="middle" class="p">选择模型</text>
  <text x="1590" y="386" text-anchor="middle" class="m">进入下一个 Step</text>
  <text x="1590" y="462" text-anchor="middle" class="m">短查询通常无需新 Run</text>

  <path d="M365 350H400" stroke="#c4b5fd" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M710 350H745" stroke="#67e8f9" stroke-width="4" marker-end="url(#cyan)"/>
  <path d="M1055 350H1090" stroke="#67e8f9" stroke-width="4" marker-end="url(#green)"/>
  <path d="M1400 350H1435" stroke="#6ee7b7" stroke-width="4" marker-end="url(#green)"/>

  <rect x="255" y="610" width="1290" height="125" rx="28" fill="#171e2e" stroke="#475569"/>
  <text x="900" y="660" text-anchor="middle" class="t">进程可以断，调用不能失踪</text>
  <text x="900" y="702" text-anchor="middle" class="p">只要已提交调用还在，尚未完成的 query 就能被重新发现并继续执行</text>
</svg>
